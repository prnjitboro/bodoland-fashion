<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bodoland Fashion</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; color: #111827; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 18px 5%; background: #ffffff; border-bottom: 1px solid #f1f5f9; position: sticky; top: 0; z-index: 50; }
    .logo { font-weight: 800; font-size: 1.1rem; letter-spacing: 1.5px; text-transform: uppercase; }
    nav a { text-decoration: none; color: #64748b; font-size: 0.9rem; margin-right: 20px; font-weight: 500; }
    nav a:hover { color: #000; }

    .hero { text-align: left; padding: 50px 5% 30px; max-width: 800px; }
    .hero span { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    .hero h1 { font-size: 2.8rem; font-weight: 800; margin: 12px 0; line-height: 1.1; color: #0f172a; }
    .hero h1 em { font-style: italic; font-weight: 400; font-family: serif; }
    .hero p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
    .hero .btn { display: inline-block; background: #000000; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.9rem; }

    .category-chips { display: flex; gap: 12px; padding: 10px 5% 30px; overflow-x: auto; }
    .chip { padding: 8px 18px; border-radius: 20px; border: 1px solid #e2e8f0; background: #fff; font-size: 0.85rem; font-weight: 600; color: #475569; cursor: pointer; white-space: nowrap; }
    .chip.active { background: #000; color: #fff; border-color: #000; }

    .section-title { padding: 0 5%; font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 0 5% 60px; }
    .card { border: 1px solid #f1f5f9; border-radius: 10px; overflow: hidden; background: #fff; display: flex; flex-direction: column; transition: transform 0.15s ease; }
    .card-img { width: 100%; height: 180px; object-fit: cover; background: #f8fafc; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .cat-tag { font-size: 0.65rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
    .p-title { font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
    .p-price { font-size: 0.95rem; font-weight: 700; color: #0f172a; margin-bottom: 12px; }
    .order-btn { margin-top: auto; width: 100%; padding: 8px; border: 1px solid #000; background: #fff; color: #000; font-weight: 600; font-size: 0.8rem; border-radius: 6px; cursor: pointer; }
    .order-btn:hover { background: #000; color: #fff; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal-card { background: #fff; border-radius: 12px; padding: 22px; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .modal-card input, .modal-card textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
    .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-submit { flex: 1; padding: 10px; background: #000; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-cancel { flex: 1; padding: 10px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">BODOLAND FASHION</div>
    <nav>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <section class="hero">
    <span>NEW COLLECTION • 2026</span>
    <h1>Style that feels <em>right.</em></h1>
    <p>Trendy fashion for men, women and kids — direct from Bodoland Fashion store.</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <div class="category-chips">
    <button class="chip active" onclick="filterCat('All')">All</button>
    <button class="chip" onclick="filterCat('Men')">Men</button>
    <button class="chip" onclick="filterCat('Women')">Women</button>
    <button class="chip" onclick="filterCat('Kids')">Kids</button>
  </div>

  <h2 class="section-title" id="products">Popular Picks</h2>
  <div class="grid" id="productGrid">
    <p style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:30px;">Connecting to store...</p>
  </div>

  <div class="modal-overlay" id="orderModal">
    <div class="modal-card">
      <h3 id="modalTitle" style="margin-bottom:4px;">Place Order</h3>
      <p id="modalPrice" style="color:#059669; font-weight:bold; margin-bottom:14px;">₹0</p>
      <input type="text" id="custName" placeholder="Your Name" required />
      <input type="tel" id="custPhone" placeholder="Mobile Number" required />
      <textarea id="custAddress" rows="3" placeholder="Full Delivery Address" required></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-submit" id="submitBtn" onclick="submitOrder()">Confirm Order</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vtrpbwhupdqzegchyoha.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GSAPqd9xHsp0BkkVYHdrNQ_zw37bsNm";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let selectedItem = null;

    async function fetchProducts() {
      const grid = document.getElementById("productGrid");
      const { data, error } = await client.from("products").select("*").order("id", { ascending: false });

      if (error || !data || data.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#94a3b8; padding:30px;'>No products in store yet. Add some from Admin Panel.</p>";
        return;
      }
      allProducts = data;
      render(allProducts);
    }

    function render(list) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = list.map(p => `
        <div class="card">
          <img class="card-img" src="${p.image_url || 'https://via.placeholder.com/300x300?text=No+Image'}" alt="${p.name}" />
          <div class="card-body">
            <span class="cat-tag">${p.category || 'Fashion'}</span>
            <div class="p-title">${p.name}</div>
            <div class="p-price">₹${Number(p.price).toFixed(2)}</div>
            <button class="order-btn" onclick="openOrder('${p.name}', ${p.price}, ${p.id})">Add to Cart</button>
          </div>
        </div>
      `).join("");
    }

    function filterCat(cat) {
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.innerText === cat);
      });
      if (cat === 'All') {
        render(allProducts);
      } else {
        render(allProducts.filter(p => (p.category || '').toLowerCase() === cat.toLowerCase()));
      }
    }

    function openOrder(name, price, id) {
      selectedItem = { name, price, id };
      document.getElementById("modalTitle").innerText = name;
      document.getElementById("modalPrice").innerText = "₹" + Number(price).toFixed(2);
      document.getElementById("orderModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("orderModal").style.display = "none";
    }

    async function submitOrder() {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();

      if (!name || !phone || !address) {
        alert("Please fill all details!");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.innerText = "Placing...";
      btn.disabled = true;

      const orderData = {
        customer_name: name,
        phone: phone,
        address: address,
        total: selectedItem.price,
        items: [{ product: selectedItem.name, price: selectedItem.price, qty: 1 }]
      };

      const { error } = await client.from("orders").insert([orderData]);

      if (error) {
        alert("Error: " + error.message);
      } else {
        alert("Order placed successfully! Details sent to Admin Panel.");
        closeModal();
      }
      btn.innerText = "Confirm Order";
      btn.disabled = false;
    }

    fetchProducts();
  </script>
</body>
</html>
