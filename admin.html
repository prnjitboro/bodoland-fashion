<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Add Product</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b1118;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 20px 14px;
      min-height: 100vh;
    }
    .form-container {
      background: #111a24;
      border: 1px solid #1e293b;
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 1.3rem;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #243547;
      background: #0b1118;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .form-group {
      flex: 1;
    }
    .size-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .size-btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #243547;
      background: #0b1118;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.2s;
    }
    .size-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }
    button.submit-btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }
    button.submit-btn:active {
      background: #0369a1;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Add New Product</h2>
    
    <form id="productForm">
      <div class="form-group">
        <label for="title">Product Name</label>
        <input type="text" id="title" placeholder="e.g. Men Graphic T-Shirt" required />
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="T-Shirts">T-Shirts</option>
          <option value="Shirts">Shirts</option>
          <option value="Jeans">Jeans</option>
          <option value="Jackets">Jackets</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="mrp">Original MRP (₹)</label>
          <input type="number" id="mrp" placeholder="999" required />
        </div>
        <div class="form-group">
          <label for="price">Offer Price (₹)</label>
          <input type="number" id="price" placeholder="599" required />
        </div>
      </div>

      <div class="form-group">
        <label>Available Sizes</label>
        <div class="size-chips" id="sizeChips">
          <button type="button" class="size-btn" data-size="S">S</button>
          <button type="button" class="size-btn" data-size="M">M</button>
          <button type="button" class="size-btn" data-size="L">L</button>
          <button type="button" class="size-btn" data-size="XL">XL</button>
          <button type="button" class="size-btn" data-size="XXL">XXL</button>
          <button type="button" class="size-btn" data-size="Free Size">Free Size</button>
        </div>
      </div>

      <div class="form-group">
        <label for="colors">Colors (Comma separated)</label>
        <input type="text" id="colors" placeholder="e.g. Red, Grey, White" />
      </div>

      <div class="form-group">
        <label for="description">Product Description</label>
        <textarea id="description" rows="3" placeholder="Cotton fabric, regular fit..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">Save Product</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://vtrpbwhupdqzegchyche.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GSAPqd9xHsp0BkkVYHdrNQ_zw37bsNm";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const sizeButtons = document.querySelectorAll(".size-btn");
    const selectedSizes = [];

    sizeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const size = btn.getAttribute("data-size");
        btn.classList.toggle("active");
        if (btn.classList.contains("active")) {
          selectedSizes.push(size);
        } else {
          const index = selectedSizes.indexOf(size);
          if (index > -1) selectedSizes.splice(index, 1);
        }
      });
    });

    const form = document.getElementById("productForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      
      submitBtn.innerText = "Saving to Database...";
      submitBtn.disabled = true;

      const title = document.getElementById("title").value;
      const category = document.getElementById("category").value;
      const mrp = Number(document.getElementById("mrp").value);
      const price = Number(document.getElementById("price").value);
      const description = document.getElementById("description").value;
      const colors = document.getElementById("colors").value;
      const sizes = selectedSizes.join(", ");

      try {
        const { data, error } = await supabaseClient
          .from("products")
          .insert([
            {
              title: title,
              category: category,
              mrp: mrp,
              price: price,
              description: description,
              colors: colors,
              sizes: sizes
            }
          ]);

        if (error) throw error;

        alert("✅ Product with Sizes & Colors saved successfully!");
        form.reset();
        selectedSizes.length = 0;
        sizeButtons.forEach(b => b.classList.remove("active"));
      } catch (err) {
        console.error("Save Error:", err);
        alert("❌ Error: " + (err.message || err));
      } finally {
        submitBtn.innerText = "Save Product";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
