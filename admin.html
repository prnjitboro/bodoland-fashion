<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Add Product</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 1.3rem;
      text-align: center;
      color: #38bdf8;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-row {
      display: flex;
      gap: 12px;
    }
    .form-row .form-group {
      flex: 1;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }
    /* Size Selector Badges */
    .size-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .size-selector label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 0;
      user-select: none;
    }
    .size-selector input[type="checkbox"] {
      display: none;
    }
    .size-selector input[type="checkbox"]:checked + span {
      color: #38bdf8;
      font-weight: 700;
    }
    .size-selector label:has(input[type="checkbox"]:checked) {
      border-color: #38bdf8;
      background: #172554;
    }
    /* Upload Box */
    .file-drop-box {
      display: block;
      cursor: pointer;
      text-align: center;
      border: 2px dashed #38bdf8;
      border-radius: 8px;
      padding: 24px 16px;
      background: #0f172a;
      transition: background 0.2s;
    }
    .file-drop-box:hover {
      background: #172554;
    }
    .file-drop-box span {
      font-size: 2rem;
      display: block;
      margin-bottom: 6px;
    }
    .file-drop-box p {
      font-size: 0.85rem;
      color: #38bdf8;
    }
    /* Image Preview */
    .preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .preview-card {
      width: 75px;
      height: 75px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #475569;
      background: #0f172a;
    }
    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-submit {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn-submit:hover {
      background: #15803d;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add New Product</h2>

    <form id="productForm">
      <!-- Product Name -->
      <div class="form-group">
        <label for="productName">Product Name</label>
        <input type="text" id="productName" placeholder="e.g. Oversized Black Hoodie" required />
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="productCategory">Category</label>
        <select id="productCategory" required>
          <option value="">Select Category</option>
          <option value="T-Shirts">T-Shirts</option>
          <option value="Hoodies & Jackets">Hoodies & Jackets</option>
          <option value="Pants & Cargo">Pants & Cargo</option>
          <option value="Footwear">Footwear / Shoes</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>

      <!-- Prices: MRP and Selling Price -->
      <div class="form-row">
        <div class="form-group">
          <label for="productMrp">Original MRP (₹)</label>
          <input type="number" id="productMrp" placeholder="e.g. 1499" />
        </div>
        <div class="form-group">
          <label for="productPrice">Offer Price (₹)</label>
          <input type="number" id="productPrice" placeholder="e.g. 799" required />
        </div>
      </div>

      <!-- Stock & Colors -->
      <div class="form-row">
        <div class="form-group">
          <label for="productStock">Stock Quantity</label>
          <input type="number" id="productStock" placeholder="e.g. 25" min="1" required />
        </div>
        <div class="form-group">
          <label for="productColors">Colors (Comma separated)</label>
          <input type="text" id="productColors" placeholder="e.g. Black, Grey, White" />
        </div>
      </div>

      <!-- Available Sizes -->
      <div class="form-group">
        <label>Available Sizes</label>
        <div class="size-selector">
          <label><input type="checkbox" name="sizes" value="S"><span>S</span></label>
          <label><input type="checkbox" name="sizes" value="M"><span>M</span></label>
          <label><input type="checkbox" name="sizes" value="L"><span>L</span></label>
          <label><input type="checkbox" name="sizes" value="XL"><span>XL</span></label>
          <label><input type="checkbox" name="sizes" value="XXL"><span>XXL</span></label>
          <label><input type="checkbox" name="sizes" value="Free Size"><span>Free Size</span></label>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="productDescription">Product Description</label>
        <textarea id="productDescription" rows="3" placeholder="Enter fabric details, fit details, wash care, etc."></textarea>
      </div>

      <!-- Photos Upload -->
      <div class="form-group">
        <label>Product Photos</label>
        <label class="file-drop-box" for="fileInput">
          <span>📁</span>
          <p>Tap to select multiple photos</p>
        </label>
        <input 
          type="file" 
          id="fileInput" 
          name="photos" 
          multiple 
          accept="image/*" 
          style="display: none;" 
          onchange="handleFiles(this)" 
        />
        <div id="previewContainer" class="preview-container"></div>
      </div>

      <button type="submit" class="btn-submit">Save Product</button>
    </form>
  </div>

  <script>
    let uploadedImages = [];

    function handleFiles(input) {
      const container = document.getElementById('previewContainer');
      container.innerHTML = '';
      uploadedImages = [];

      if (input.files && input.files.length > 0) {
        Array.from(input.files).forEach(file => {
          if (!file.type.startsWith('image/')) return;

          const reader = new FileReader();
          reader.onload = function(e) {
            uploadedImages.push(e.target.result);

            const card = document.createElement('div');
            card.className = 'preview-card';

            const img = document.createElement('img');
            img.src = e.target.result;

            card.appendChild(img);
            container.appendChild(card);
          };
          reader.readAsDataURL(file);
        });
      }
    }

    // Form submit listener - data pack hone ka ready object
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Selected sizes nikaalna
      const selectedSizes = Array.from(document.querySelectorAll('input[name="sizes"]:checked')).map(cb => cb.value);

      // Colors list nikaalna
      const colors = document.getElementById('productColors').value
        .split(',')
        .map(c => c.trim())
        .filter(c => c.length > 0);

      const productData = {
        name: document.getElementById('productName').value,
        category: document.getElementById('productCategory').value,
        mrp: document.getElementById('productMrp').value,
        price: document.getElementById('productPrice').value,
        stock: document.getElementById('productStock').value,
        colors: colors,
        sizes: selectedSizes,
        description: document.getElementById('productDescription').value,
        photos: uploadedImages
      };

      console.log('Final Product Data:', productData);
      alert('Product Data Ready: ' + productData.name);
    });
  </script>

</body>
</html>
