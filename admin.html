<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Add Product</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 1.3rem;
      text-align: center;
      color: #38bdf8;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #38bdf8;
    }
    /* Upload Box */
    .file-drop-box {
      display: block;
      cursor: pointer;
      text-align: center;
      border: 2px dashed #38bdf8;
      border-radius: 8px;
      padding: 24px 16px;
      background: #0f172a;
      transition: background 0.2s;
    }
    .file-drop-box:hover {
      background: #172554;
    }
    .file-drop-box span {
      font-size: 2rem;
      display: block;
      margin-bottom: 6px;
    }
    .file-drop-box p {
      font-size: 0.85rem;
      color: #38bdf8;
    }
    /* Image Preview */
    .preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .preview-card {
      width: 75px;
      height: 75px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #475569;
      background: #0f172a;
    }
    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-submit {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn-submit:hover {
      background: #15803d;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add New Product</h2>

    <form id="productForm">
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" placeholder="e.g. T-Shirt" required />
      </div>

      <div class="form-group">
        <label>Price (₹)</label>
        <input type="number" placeholder="e.g. 499" required />
      </div>

      <div class="form-group">
        <label>Product Photos (Choose from Phone Gallery)</label>
        
        <!-- File Input Label -->
        <label class="file-drop-box" for="fileInput">
          <span>📁</span>
          <p>Tap to select multiple photos</p>
        </label>

        <!-- Hidden Multiple File Input -->
        <input 
          type="file" 
          id="fileInput" 
          name="photos" 
          multiple 
          accept="image/*" 
          style="display: none;" 
          onchange="handleFiles(this)" 
        />

        <!-- Image Previews Container -->
        <div id="previewContainer" class="preview-container"></div>
      </div>

      <button type="submit" class="btn-submit">Save Product</button>
    </form>
  </div>

  <script>
    function handleFiles(input) {
      const container = document.getElementById('previewContainer');
      container.innerHTML = ''; // Pehle ki previews clear karne ke liye

      if (input.files && input.files.length > 0) {
        Array.from(input.files).forEach(file => {
          if (!file.type.startsWith('image/')) return;

          const reader = new FileReader();
          reader.onload = function(e) {
            const card = document.createElement('div');
            card.className = 'preview-card';

            const img = document.createElement('img');
            img.src = e.target.result;

            card.appendChild(img);
            container.appendChild(card);
          };
          reader.readAsDataURL(file);
        });
      }
    }

    // Form submit test handler
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Form submitted successfully!');
    });
  </script>

</body>
</html>
