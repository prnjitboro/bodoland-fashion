<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bodoland Fashion</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; color: #111827; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 18px 5%; background: #ffffff; border-bottom: 1px solid #f1f5f9; position: sticky; top: 0; z-index: 50; }
    .logo { font-weight: 800; font-size: 1.1rem; letter-spacing: 1.5px; text-transform: uppercase; }
    nav a { text-decoration: none; color: #64748b; font-size: 0.9rem; font-weight: 500; }

    .hero { text-align: left; padding: 40px 5% 24px; max-width: 800px; }
    .hero span { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    .hero h1 { font-size: 2.6rem; font-weight: 800; margin: 12px 0; line-height: 1.1; color: #0f172a; }
    .hero h1 em { font-style: italic; font-weight: 400; font-family: serif; }
    .hero p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
    .hero .btn { display: inline-block; background: #000000; color: #ffffff; padding: 10px 22px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }

    .category-chips { display: flex; gap: 10px; padding: 10px 5% 24px; overflow-x: auto; }
    .chip { padding: 6px 16px; border-radius: 20px; border: 1px solid #e2e8f0; background: #fff; font-size: 0.85rem; font-weight: 600; color: #475569; cursor: pointer; white-space: nowrap; }
    .chip.active { background: #000; color: #fff; border-color: #000; }

    .section-title { padding: 0 5%; font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 0 5% 60px; }
    .card { border: 1px solid #f1f5f9; border-radius: 12px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 190px; object-fit: cover; background: #f8fafc; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .cat-tag { font-size: 0.65rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
    .p-title { font-size: 0.95rem; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
    .p-price { font-size: 1.05rem; font-weight: 700; color: #0f172a; margin-bottom: 12px; }
    .order-btn { margin-top: auto; width: 100%; padding: 9px; border: 1px solid #000; background: #000; color: #fff; font-weight: 600; font-size: 0.85rem; border-radius: 6px; cursor: pointer; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal-card { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 390px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px rgba(0,0,0,0.2); }
    .modal-card label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b; margin: 10px 0 6px; }
    
    /* Size Selector */
    .size-picker { display: flex; gap: 8px; margin-bottom: 8px; }
    .size-btn { flex: 1; padding: 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .size-btn.selected { background: #000; color: #fff; border-color: #000; }

    /* Payment Option Selector */
    .pay-methods { display: flex; gap: 8px; margin-bottom: 12px; }
    .pay-btn { flex: 1; padding: 9px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .pay-btn.selected { background: #0284c7; color: #fff; border-color: #0284c7; }

    /* QR Code Display Box */
    #qrBox { display: none; text-align: center; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    #qrImg { width: 150px; height: 150px; margin: 0 auto; display: block; border-radius: 6px; }

    .modal-card input, .modal-card textarea { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn-submit { flex: 1; padding: 11px; background: #000; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-cancel { flex: 1; padding: 11px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">BODOLAND FASHION</div>
    <nav><a href="admin.html">Admin</a></nav>
  </header>

  <section class="hero">
    <span>NEW COLLECTION • 2026</span>
    <h1>Style that feels <em>right.</em></h1>
    <p>Trendy fashion for men, women and kids — direct from Bodoland Fashion store.</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <div class="category-chips">
    <button class="chip active" onclick="filterCat('All')">All</button>
    <button class="chip" onclick="filterCat('Men')">Men</button>
    <button class="chip" onclick="filterCat('Women')">Women</button>
    <button class="chip" onclick="filterCat('Kids')">Kids</button>
  </div>

  <h2 class="section-title" id="products">Popular Picks</h2>
  <div class="grid" id="productGrid">
    <p style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:30px;">Connecting to store...</p>
  </div>

  <!-- Order Modal with Size + UPI QR / COD -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-card">
      <h3 id="modalTitle" style="margin-bottom:2px;">Checkout</h3>
      <p id="modalPrice" style="color:#059669; font-weight:bold; font-size:1.15rem; margin-bottom:6px;">₹0</p>
      
      <label>Choose Size</label>
      <div class="size-picker">
        <button type="button" class="size-btn" onclick="selectSize(this, 'S')">S</button>
        <button type="button" class="size-btn selected" onclick="selectSize(this, 'M')">M</button>
        <button type="button" class="size-btn" onclick="selectSize(this, 'L')">L</button>
        <button type="button" class="size-btn" onclick="selectSize(this, 'XL')">XL</button>
        <button type="button" class="size-btn" onclick="selectSize(this, 'XXL')">XXL</button>
      </div>

      <label>Payment Method</label>
      <div class="pay-methods">
        <button type="button" class="pay-btn selected" id="btnCod" onclick="selectPayment('COD')">Cash on Delivery</button>
        <button type="button" class="pay-btn" id="btnUpi" onclick="selectPayment('UPI')">UPI / QR Code</button>
      </div>

      <!-- Live Dynamic UPI QR Box -->
      <div id="qrBox">
        <p style="font-size:0.8rem; color:#475569; margin-bottom:8px;">Scan with <b>GPay / PhonePe / Paytm</b> to pay</p>
        <img id="qrImg" src="" alt="UPI QR Code" />
        <input type="text" id="upiTxnId" placeholder="Enter UPI UTR / Ref No. after payment" style="margin-top:10px; font-size:0.8rem;" />
      </div>

      <label>Delivery Details</label>
      <input type="text" id="custName" placeholder="Your Full Name" required />
      <input type="tel" id="custPhone" placeholder="Mobile Number (WhatsApp)" required />
      <textarea id="custAddress" rows="3" placeholder="Delivery Address with Pincode" required></textarea>
      
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-submit" id="submitBtn" onclick="submitOrder()">Place Order</button>
      </div>
    </div>
  </div>

  <script>
    // UPI ID jahan payment aayegi (aap isko apni UPI id se badal sakte hain)
    const STORE_UPI_ID = "prnjitboro-3@okaxis";

    const SUPABASE_URL = "https://vtrpbwhupdqzegchyoha.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GSAPqd9xHsp0BkkVYHdrNQ_zw37bsNm";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let selectedItem = null;
    let chosenSize = "M";
    let chosenPayment = "COD";

    function selectSize(btn, size) {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      chosenSize = size;
    }

    function selectPayment(method) {
      chosenPayment = method;
      const btnCod = document.getElementById("btnCod");
      const btnUpi = document.getElementById("btnUpi");
      const qrBox = document.getElementById("qrBox");

      if (method === 'UPI') {
        btnUpi.classList.add('selected');
        btnCod.classList.remove('selected');
        qrBox.style.display = "block";
        
        // Generate Dynamic UPI QR for this product price
        const upiPayString = `upi://pay?pa=${STORE_UPI_ID}&pn=BodolandFashion&am=${selectedItem.price}&cu=INR`;
        document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiPayString)}`;
      } else {
        btnCod.classList.add('selected');
        btnUpi.classList.remove('selected');
        qrBox.style.display = "none";
      }
    }

    async function fetchProducts() {
      const grid = document.getElementById("productGrid");
      const { data, error } = await client.from("products").select("*").order("id", { ascending: false });

      if (error || !data || data.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#94a3b8; padding:30px;'>No products in store yet.</p>";
        return;
      }
      allProducts = data;
      render(allProducts);
    }

    function render(list) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = list.map(p => `
        <div class="card">
          <img class="card-img" src="${p.image_url || 'https://via.placeholder.com/300x300?text=No+Image'}" alt="${p.name}" />
          <div class="card-body">
            <span class="cat-tag">${p.category || 'Fashion'}</span>
            <div class="p-title">${p.name}</div>
            <div class="p-price">₹${Number(p.price).toFixed(2)}</div>
            <button class="order-btn" onclick="openOrder('${p.name}', ${p.price}, ${p.id})">Buy Now</button>
          </div>
        </div>
      `).join("");
    }

    function filterCat(cat) {
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.innerText === cat));
      if (cat === 'All') render(allProducts);
      else render(allProducts.filter(p => (p.category || '').toLowerCase() === cat.toLowerCase()));
    }

    function openOrder(name, price, id) {
      selectedItem = { name, price, id };
      chosenSize = "M";
      selectPayment("COD");
      document.querySelectorAll('.size-btn').forEach(b => b.classList.toggle('selected', b.innerText === 'M'));
      document.getElementById("modalTitle").innerText = name;
      document.getElementById("modalPrice").innerText = "₹" + Number(price).toFixed(2);
      document.getElementById("orderModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("orderModal").style.display = "none";
    }

    async function submitOrder() {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const upiRef = document.getElementById("upiTxnId").value.trim();

      if (!name || !phone || !address) {
        alert("Please fill all details!");
        return;
      }

      if (chosenPayment === 'UPI' && !upiRef) {
        alert("Please enter UPI Reference / UTR Number after scanning the QR code!");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.innerText = "Placing...";
      btn.disabled = true;

      const payNote = chosenPayment === 'UPI' ? `Paid via UPI (Ref: ${upiRef})` : "Cash on Delivery";
      const itemWithDetails = `${selectedItem.name} [Size: ${chosenSize}] [${payNote}]`;

      const orderData = {
        customer_name: name,
        phone: phone,
        address: `${address} | Payment: ${payNote}`,
        total: selectedItem.price,
        items: [{ product: itemWithDetails, price: selectedItem.price, qty: 1 }]
      };

      const { error } = await client.from("orders").insert([orderData]);

      if (error) {
        alert("Error: " + error.message);
      } else {
        alert("Order placed successfully! (" + payNote + ")");
        closeModal();
      }
      btn.innerText = "Place Order";
      btn.disabled = false;
    }

    fetchProducts();
  </script>
</body>
</html>
