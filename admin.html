<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bodoland Fashion - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 4px; font-size: 1.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 16px; font-size: 0.9rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 20px; border: 1px solid #334155; }
    h2 { margin-top: 0; font-size: 1.15rem; color: #38bdf8; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
    label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; display: block; }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;
    }
    button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
    .btn-danger { background: #e11d48; padding: 6px 10px; font-size: 0.8rem; width: auto; }
    .btn-whatsapp { background: #22c55e; color: white; text-decoration: none; padding: 5px 9px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; min-width: 600px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #334155; font-size: 0.85rem; vertical-align: top; }
    th { color: #94a3b8; font-weight: 600; }
    .product-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; background: #334155; }
    .order-badge { background: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; color: #e0f2fe; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bodoland Fashion Admin</h1>
    <p class="subtitle">Products & Live Customer Orders</p>

    <!-- Add Product -->
    <div class="card">
      <h2>Add New Product</h2>
      <form id="productForm">
        <div class="form-grid">
          <div><label>Product Name</label><input type="text" id="pName" placeholder="e.g. Traditional Shirt" required /></div>
          <div><label>Category</label><input type="text" id="pCategory" placeholder="e.g. Shirts, Sarees" required /></div>
          <div><label>Price (₹)</label><input type="number" step="0.01" id="pPrice" placeholder="550" required /></div>
          <div><label>Product Image</label><input type="file" id="pImage" accept="image/*" /></div>
        </div>
        <button type="submit" id="submitBtn">Add Product</button>
      </form>
    </div>

    <!-- Products Store -->
    <div class="card">
      <h2>Products in Store</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr><th>Photo</th><th>Name</th><th>Category</th><th>Price</th><th>Action</th></tr>
          </thead>
          <tbody id="productsTableBody"><tr><td colspan="5">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Customer Orders -->
    <div class="card">
      <h2>Customer Orders</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Items & Total</th>
              <th>Address</th>
              <th>Contact</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"><tr><td colspan="5">Loading orders...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vtrpbwhupdqzegchyoha.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GSAPqd9xHsp0BkkVYHdrNQ_zw37bsNm";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchProducts() {
      const tbody = document.getElementById("productsTableBody");
      const { data } = await client.from("products").select("*").order("id", { ascending: false });
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#94a3b8;">No products found.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(item => `
        <tr>
          <td>${item.image_url ? `<img src="${item.image_url}" class="product-thumb"/>` : '-'}</td>
          <td><b>${item.name}</b></td>
          <td>${item.category || '-'}</td>
          <td style="color:#4ade80;">₹${Number(item.price).toFixed(2)}</td>
          <td><button class="btn-danger" onclick="deleteProduct(${item.id})">Delete</button></td>
        </tr>
      `).join("");
    }

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "Saving...";

      const name = document.getElementById("pName").value.trim();
      const category = document.getElementById("pCategory").value.trim();
      const price = parseFloat(document.getElementById("pPrice").value);
      const fileInput = document.getElementById("pImage");
      let imageUrl = null;

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '_')}`;
          const { error: upErr } = await client.storage.from("product-images").upload(fileName, file);
          if (!upErr) {
            const { data } = client.storage.from("product-images").getPublicUrl(fileName);
            imageUrl = data.publicUrl;
          }
        }
        await client.from("products").insert([{ name, category, price, image_url: imageUrl }]);
        alert("Product add ho gaya!");
        document.getElementById("productForm").reset();
        fetchProducts();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Add Product";
      }
    });

    async function deleteProduct(id) {
      if (!confirm("Are you sure?")) return;
      await client.from("products").delete().eq("id", id);
      fetchProducts();
    }

    async function fetchOrders() {
      const tbody = document.getElementById("ordersTableBody");
      const { data, error } = await client.from("orders").select("*").order("id", { ascending: false });

      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#94a3b8;">No orders found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(o => {
        const phone = o.phone || o.customer_phone || "";
        const cleanPhone = phone.replace(/[^0-9]/g, "");
        const formattedPhone = cleanPhone.length === 10 ? "91" + cleanPhone : cleanPhone;
        const msg = encodeURIComponent(`Hello ${o.customer_name || 'Customer'}, regarding your order #${o.id} at Bodoland Fashion...`);
        const itemSummary = o.product_name ? o.product_name : (Array.isArray(o.items) ? o.items.map(i => i.product).join(", ") : "-");

        return `
          <tr>
            <td><span class="order-badge">#${o.id}</span></td>
            <td>
              <strong>${o.customer_name || 'Anonymous'}</strong><br/>
              <span style="color:#94a3b8; font-size:0.8rem;">${phone}</span>
            </td>
            <td>
              <div>${itemSummary}</div>
              <strong style="color:#4ade80;">₹${o.total || o.price || 0}</strong>
            </td>
            <td style="max-width:180px; word-break:break-word;">${o.address || '-'}</td>
            <td>
              ${phone ? `<a href="https://wa.me/${formattedPhone}?text=${msg}" target="_blank" class="btn-whatsapp">WhatsApp</a>` : '-'}
            </td>
          </tr>
        `;
      }).join("");
    }

    fetchProducts();
    fetchOrders();
  </script>
</body>
</html>
